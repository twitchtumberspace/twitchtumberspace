version: '3.9'
services:
  backend:
    build: ./backend
    environment:
      DATABASE_URL: sqlite:///./trading.db
      ALLOW_LIVE_TRADING: 'false'
    ports:
      - '8000:8000'
  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
    depends_on:
      - backend
    ports:
      - '3000:3000'
